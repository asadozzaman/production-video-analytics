name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOLO_CONFIG_DIR: /tmp/ultralytics-config
      MPLCONFIGDIR: /tmp/matplotlib-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and inspect CLI
        run: |
          python -m compileall -q src tests
          python -m src.run_video --help
      - name: Test tracker and result contracts
        run: python -m unittest discover -s tests -v
